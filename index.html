<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Rakhi Banner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
}

body{
    background:#ffffff;
}


/* =========================================
   MAIN BANNER
========================================= */

.banner{
    width:100%;
    height:180px;

    position:relative;
    overflow:hidden;

    background:#ffc95f;
}


/* =========================================
   STATIC LIGHT STRINGS
========================================= */

.string{
    position:absolute;

    top:0;

    width:24%;
    height:54px;

    z-index:50;

    pointer-events:none;
}

.left-string{
    left:0;
}

.right-string{
    right:0;
}


/* =========================================
   WIRE
========================================= */

.wire{
    position:absolute;

    top:-35px;

    width:120%;
    height:60px;

    border-bottom:2px solid #98251c;
}

.left-string .wire{
    left:-18px;

    border-radius:0 0 70% 55%;

    transform:rotate(-4deg);
}

.right-string .wire{
    right:-18px;

    border-radius:0 0 55% 70%;

    transform:rotate(4deg);
}


/* =========================================
   BULBS
========================================= */

.bulb{
    position:absolute;

    width:13px;
    height:24px;

    transform-origin:top center;
}


.bulb .cord{
    position:absolute;

    left:50%;
    top:0;

    width:1.5px;
    height:6px;

    transform:translateX(-50%);

    background:#85271d;
}


.bulb .socket{
    position:absolute;

    left:50%;
    top:5px;

    width:6px;
    height:5px;

    transform:translateX(-50%);

    background:#68432d;

    border-radius:2px 2px 1px 1px;
}


.bulb .glass{
    position:absolute;

    left:50%;
    top:9px;

    width:10px;
    height:12px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle at 32% 25%,
            #ffffff 0%,
            #fff6c9 15%,
            #ffd665 38%,
            #ffb22f 68%,
            #ed8c1c 100%
        );

    border-radius:55% 55% 46% 46%;

    border:1px solid rgba(183,89,8,.3);

    box-shadow:
        0 0 3px rgba(255,190,55,.3);
}


/* =========================================
   LEFT BULBS
========================================= */

.left-string .b1{
    left:5%;
    top:22px;
    transform:rotate(-12deg);
}

.left-string .b2{
    left:33%;
    top:15px;
    transform:rotate(-7deg);
}

.left-string .b3{
    left:61%;
    top:8px;
    transform:rotate(-3deg);
}

.left-string .b4{
    left:89%;
    top:2px;
    transform:rotate(2deg);
}


/* =========================================
   RIGHT BULBS
========================================= */

.right-string .b1{
    right:5%;
    top:22px;
    transform:rotate(12deg);
}

.right-string .b2{
    right:33%;
    top:15px;
    transform:rotate(7deg);
}

.right-string .b3{
    right:61%;
    top:8px;
    transform:rotate(3deg);
}

.right-string .b4{
    right:89%;
    top:2px;
    transform:rotate(-2deg);
}


/* =========================================
   LEFT TEXT AREA
   PROPER VERTICAL CENTER
========================================= */

.rakhi-copy{
    position:absolute;

    left:5%;

    top:50%;

    width:50%;

    z-index:10;

    display:flex;
    flex-direction:column;

    align-items:flex-start;
    justify-content:center;

    transform:
        translateX(0)
        translateY(-50%);

    animation:
        textMove
        12s
        ease-in-out
        infinite;
}


/* =========================================
   CELEBRATE RAKHI
   CLEAN - NOT CURSIVE
========================================= */

.rakhi-title{
    font-family:
        "Fredoka",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    font-size:
        clamp(24px,4vw,41px);

    font-weight:700;

    line-height:.95;

    letter-spacing:-1px;

    color:#d9251d;

    white-space:nowrap;

    -webkit-text-stroke:
        2px #ffffff;

    paint-order:
        stroke fill;

    text-shadow:
        0 3px 0 #a51e18,
        0 5px 8px rgba(117,52,17,.15);
}


/* =========================================
   SMALL LINE UNDER TITLE
========================================= */

.rakhi-subtitle{
    margin-top:12px;

    font-family:
        "DM Sans",
        Arial,
        sans-serif;

    font-size:
        clamp(8px,1.35vw,13px);

    font-weight:600;

    line-height:1.3;

    letter-spacing:.15px;

    color:#7d3b29;

    white-space:nowrap;
}


/* SMALL ACCENT LINE */

.rakhi-subtitle::before{
    content:"";

    display:inline-block;

    width:18px;
    height:2px;

    margin-right:7px;
    margin-bottom:3px;

    border-radius:5px;

    background:#d9251d;
}


/* =========================================
   TEXT MOVEMENT
========================================= */

@keyframes textMove{

    0%,
    31%{
        opacity:1;

        transform:
            translateX(0)
            translateY(-50%);
    }


    40%{
        opacity:1;

        transform:
            translateX(-120%)
            translateY(-50%);
    }


    58%{
        opacity:0;

        transform:
            translateX(-120%)
            translateY(-50%);
    }


    66%{
        opacity:1;

        transform:
            translateX(0)
            translateY(-50%);
    }


    100%{
        opacity:1;

        transform:
            translateX(0)
            translateY(-50%);
    }
}


/* =========================================
   IMAGE PLAYER
========================================= */

.image-player{
    position:absolute;

    right:8px;
    bottom:0;

    width:38%;
    height:72%;

    z-index:10;

    pointer-events:none;
}


.image-player img{
    position:absolute;

    right:0;
    bottom:0;

    width:100%;
    height:100%;

    object-fit:contain;
    object-position:right bottom;

    opacity:0;

    transition:none !important;
}


/* =========================================
   IMAGE 1
========================================= */

.image1{
    animation:
        imageOne
        12s
        steps(1,end)
        infinite;
}


@keyframes imageOne{

    0%{
        opacity:1;
    }

    10%{
        opacity:0;
    }

    10.1%,
    76%{
        opacity:0;
    }

    76.1%{
        opacity:1;
    }

    100%{
        opacity:1;
    }
}


/* =========================================
   IMAGE 2
========================================= */

.image2{
    animation:
        imageTwo
        12s
        steps(1,end)
        infinite;
}


@keyframes imageTwo{

    0%,
    9.9%{
        opacity:0;
    }

    10%{
        opacity:1;
    }

    20%{
        opacity:0;
    }

    20.1%,
    65.9%{
        opacity:0;
    }

    66%{
        opacity:1;
    }

    76%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================================
   IMAGE 3
========================================= */

.image3{
    animation:
        imageThree
        12s
        ease-in-out
        infinite;
}


@keyframes imageThree{

    0%,
    19.9%{
        opacity:0;
        transform:translateX(0);
    }

    20%{
        opacity:1;
        transform:translateX(0);
    }

    31%{
        opacity:1;
        transform:translateX(0);
    }


    /* RIGHT → LEFT */

    41%{
        opacity:1;
        transform:translateX(-145%);
    }


    /* STAY LEFT */

    55%{
        opacity:1;
        transform:translateX(-145%);
    }


    /* LEFT → RIGHT */

    65%{
        opacity:1;
        transform:translateX(0);
    }


    66%{
        opacity:1;
        transform:translateX(0);
    }


    66.1%{
        opacity:0;
        transform:translateX(0);
    }


    100%{
        opacity:0;
        transform:translateX(0);
    }
}


/* =========================================
   SIS / BRO WRAPPER
========================================= */

.score-wrap{
    position:absolute;

    right:7%;
    top:34%;

    width:140px;

    z-index:30;

    opacity:0;

    transform:
        translateX(150%);

    animation:
        scoreMove
        12s
        ease-in-out
        infinite;
}


/* =========================================
   SCORE MOVEMENT
========================================= */

@keyframes scoreMove{

    0%,
    36%{
        opacity:0;

        transform:
            translateX(150%);
    }


    44%{
        opacity:1;

        transform:
            translateX(0);
    }


    54%{
        opacity:1;

        transform:
            translateX(0);
    }


    63%{
        opacity:1;

        transform:
            translateX(150%);
    }


    64%,
    100%{
        opacity:0;

        transform:
            translateX(150%);
    }
}


/* =========================================
   SCORE CARD
========================================= */

.score-card{
    width:100%;

    overflow:hidden;

    border-radius:12px;

    border:
        2px solid #d0005a;

    background:#ffc95f;
}


/* SCORE TOP */

.score-top{
    display:flex;

    align-items:center;
    justify-content:center;

    height:48px;

    background:#d0005a;

    color:#ffffff;
}


/* SCORE SIDE */

.score-side{
    width:50%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    font-family:
        "DM Sans",
        Arial,
        sans-serif;

    font-weight:700;
}


.score-number{
    font-size:20px;

    line-height:.85;
}


.score-name{
    margin-top:5px;

    font-size:10px;

    line-height:1;
}


/* SCORE DIVIDER */

.score-divider{
    width:1px;
    height:29px;

    background:
        rgba(255,255,255,.9);
}


/* SCORE MESSAGE */

.score-message{
    height:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:0 5px;

    font-family:
        "DM Sans",
        Arial,
        sans-serif;

    font-size:8px;

    font-weight:600;

    color:#bd2545;

    white-space:nowrap;
}


/* =========================================
   ARROW
========================================= */

.arrow-area{
    width:100%;

    height:33px;

    padding-top:4px;

    display:flex;

    align-items:flex-start;
    justify-content:center;
}


.score-arrow{
    width:36px;
    height:24px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:#d0005a;

    color:#ffffff;

    font-family:Arial,sans-serif;

    font-size:18px;

    line-height:1;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .banner{
        height:155px;
    }


    /* TEXT */

    .rakhi-copy{
        left:4%;

        top:50%;

        width:54%;
    }


    .rakhi-title{
        font-size:
            clamp(20px,6vw,30px);

        -webkit-text-stroke:
            1.5px #ffffff;
    }


    .rakhi-subtitle{
        margin-top:9px;

        font-size:
            clamp(7px,2vw,9.5px);
    }


    .rakhi-subtitle::before{
        width:13px;

        margin-right:5px;
        margin-bottom:2px;
    }


    /* IMAGE */

    .image-player{
        right:3px;

        width:39%;
        height:68%;
    }


    /* LIGHT */

    .string{
        width:22%;
    }


    /* SCORE */

    .score-wrap{
        right:5%;
        top:30%;

        width:125px;
    }


    .score-top{
        height:44px;
    }


    .score-number{
        font-size:18px;
    }


    .score-name{
        margin-top:4px;

        font-size:9px;
    }


    .score-divider{
        height:26px;
    }


    .score-message{
        height:24px;

        font-size:7px;
    }


    .score-arrow{
        width:34px;
        height:23px;

        font-size:17px;
    }


    /* MOBILE 3RD IMAGE */

    @keyframes imageThree{

        0%,
        19.9%{
            opacity:0;
            transform:translateX(0);
        }

        20%{
            opacity:1;
            transform:translateX(0);
        }

        31%{
            opacity:1;
            transform:translateX(0);
        }

        41%{
            opacity:1;
            transform:translateX(-140%);
        }

        55%{
            opacity:1;
            transform:translateX(-140%);
        }

        65%{
            opacity:1;
            transform:translateX(0);
        }

        66%{
            opacity:1;
            transform:translateX(0);
        }

        66.1%,
        100%{
            opacity:0;
            transform:translateX(0);
        }
    }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media(max-width:390px){

    .banner{
        height:145px;
    }


    .rakhi-copy{
        left:3%;

        top:50%;

        width:56%;
    }


    .rakhi-title{
        font-size:
            clamp(18px,5.7vw,26px);

        letter-spacing:-.7px;
    }


    .rakhi-subtitle{
        margin-top:7px;

        font-size:
            clamp(6.2px,1.8vw,8px);
    }


    .rakhi-subtitle::before{
        width:11px;
    }


    .image-player{
        right:2px;

        width:40%;
        height:65%;
    }


    .score-wrap{
        right:4%;
        top:27%;

        width:115px;
    }


    .score-top{
        height:40px;
    }


    .score-number{
        font-size:16px;
    }


    .score-name{
        font-size:8px;
    }


    .score-divider{
        height:23px;
    }


    .score-message{
        height:22px;

        font-size:6.5px;
    }


    .arrow-area{
        height:28px;
    }


    .score-arrow{
        width:32px;
        height:22px;

        font-size:16px;
    }

}

</style>
</head>


<body>


<div class="banner">


    <!-- =================================
         STATIC LEFT LIGHTS
    ================================== -->

    <div class="string left-string">

        <div class="wire"></div>

        <div class="bulb b1">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b2">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b3">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b4">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

    </div>



    <!-- =================================
         STATIC RIGHT LIGHTS
    ================================== -->

    <div class="string right-string">

        <div class="wire"></div>

        <div class="bulb b1">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b2">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b3">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

        <div class="bulb b4">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>

    </div>



    <!-- =================================
         LEFT TEXT
    ================================== -->

    <div class="rakhi-copy">

        <div class="rakhi-title">
            Celebrate Rakhi
        </div>

        <div class="rakhi-subtitle">
            A bond that grows stronger every year
        </div>

    </div>



    <!-- =================================
         IMAGE PLAYER

         1 → 2 → 3
         3 → LEFT
         3 → RIGHT
         3 → 2 → 1
    ================================== -->

    <div class="image-player">

        <img
            src="1.png"
            class="image1"
            alt=""
        >

        <img
            src="2.png"
            class="image2"
            alt=""
        >

        <img
            src="3.png"
            class="image3"
            alt=""
        >

    </div>



    <!-- =================================
         SIS / BRO
    ================================== -->

    <div class="score-wrap">


        <div class="score-card">


            <div class="score-top">


                <div class="score-side">

                    <div class="score-number">
                        1
                    </div>

                    <div class="score-name">
                        Sis
                    </div>

                </div>


                <div class="score-divider"></div>


                <div class="score-side">

                    <div class="score-number">
                        0
                    </div>

                    <div class="score-name">
                        Bro
                    </div>

                </div>


            </div>


            <div class="score-message">
                Settle the score now
            </div>


        </div>


        <div class="arrow-area">

            <div class="score-arrow">
                →
            </div>

        </div>


    </div>


</div>


</body>
</html>
