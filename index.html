<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Rakhi Banner</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
}

body{
    background:#ffffff;
}


/* =========================================
   MAIN BANNER
========================================= */

.banner{
    width:100%;
    height:180px;

    position:relative;
    overflow:hidden;

    background:#ffc95f;
}


/* =========================================
   CELEBRATE RAKHI TITLE
========================================= */

.rakhi-title{
    position:absolute;

    left:5%;
    top:56%;

    transform:translateY(-50%);

    z-index:10;

    white-space:nowrap;

    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

    font-size:clamp(20px, 3.5vw, 35px);

    font-weight:900;

    line-height:1;

    letter-spacing:-0.8px;

    color:#d92d20;

    -webkit-text-stroke:2px #ffffff;

    paint-order:stroke fill;

    text-shadow:
        0 2px 0 #a51f17,
        0 4px 5px rgba(120,50,20,.15);
}


/* =========================================
   IMAGE PLAYER
========================================= */

.image-player{
    position:absolute;

    right:8px;
    bottom:0;

    width:38%;
    height:72%;

    z-index:5;

    pointer-events:none;
}


.image-player img{
    position:absolute;

    right:0;
    bottom:0;

    width:100%;
    height:100%;

    object-fit:contain;
    object-position:right bottom;

    opacity:0;

    /* NO SMOOTH TRANSITION */

    transition:none !important;
}


/* =========================================
   INSTANT IMAGE SWITCHING

   1.png
   ↓
   2.png
   ↓
   3.png
   ↓
   repeat

   NO FADE
========================================= */

.image1{
    animation:
        show1
        3s
        steps(1,end)
        infinite;
}


.image2{
    animation:
        show2
        3s
        steps(1,end)
        infinite;
}


.image3{
    animation:
        show3
        3s
        steps(1,end)
        infinite;
}


/* IMAGE 1 */

@keyframes show1{

    0%{
        opacity:1;
    }

    33.333%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* IMAGE 2 */

@keyframes show2{

    0%{
        opacity:0;
    }

    33.333%{
        opacity:1;
    }

    66.666%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* IMAGE 3 */

@keyframes show3{

    0%{
        opacity:0;
    }

    33.333%{
        opacity:0;
    }

    66.666%{
        opacity:1;
    }

    100%{
        opacity:1;
    }
}


/* =========================================
   LEFT + RIGHT STRING
========================================= */

.string{
    position:absolute;

    top:0;

    width:24%;
    height:54px;

    z-index:20;

    pointer-events:none;
}


.left-string{
    left:0;
}


.right-string{
    right:0;
}


/* =========================================
   WIRES
========================================= */

.wire{
    position:absolute;

    top:-35px;

    width:120%;
    height:60px;

    border-bottom:2px solid #98251c;
}


/* LEFT WIRE */

.left-string .wire{
    left:-18px;

    border-radius:
        0 0 70% 55%;

    transform:rotate(-4deg);
}


/* RIGHT WIRE */

.right-string .wire{
    right:-18px;

    border-radius:
        0 0 55% 70%;

    transform:rotate(4deg);
}


/* =========================================
   BULB
========================================= */

.bulb{
    position:absolute;

    width:13px;
    height:24px;

    transform-origin:top center;
}


/* =========================================
   BULB CORD
========================================= */

.bulb .cord{
    position:absolute;

    left:50%;
    top:0;

    width:1.5px;
    height:6px;

    transform:translateX(-50%);

    background:#85271d;

    border-radius:2px;
}


/* =========================================
   BULB SOCKET
========================================= */

.bulb .socket{
    position:absolute;

    left:50%;
    top:5px;

    width:6px;
    height:5px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to right,
            #51301f,
            #825334,
            #51301f
        );

    border-radius:2px 2px 1px 1px;
}


/* SOCKET DETAILS */

.bulb .socket::before,
.bulb .socket::after{
    content:"";

    position:absolute;

    left:1px;
    right:1px;

    height:1px;

    background:
        rgba(255,225,180,.45);
}


.bulb .socket::before{
    top:1px;
}


.bulb .socket::after{
    top:3px;
}


/* =========================================
   BULB GLASS
========================================= */

.bulb .glass{
    position:absolute;

    left:50%;
    top:9px;

    width:10px;
    height:12px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle at 32% 25%,
            #ffffff 0%,
            #fff6c9 15%,
            #ffd665 38%,
            #ffb22f 68%,
            #ed8c1c 100%
        );

    border-radius:
        55% 55%
        46% 46%;

    border:
        1px solid
        rgba(183,89,8,.30);

    box-shadow:
        0 0 3px
        rgba(255,190,55,.30);
}


/* BULB NECK */

.bulb .glass::before{
    content:"";

    position:absolute;

    left:50%;
    top:-2px;

    width:5px;
    height:3px;

    transform:translateX(-50%);

    background:#ee9d28;

    border-radius:
        3px 3px
        1px 1px;
}


/* BULB REFLECTION */

.bulb .glass::after{
    content:"";

    position:absolute;

    left:2px;
    top:2px;

    width:2px;
    height:4px;

    border-radius:50%;

    background:
        rgba(255,255,255,.85);

    transform:rotate(18deg);
}


/* =========================================
   LEFT BULB POSITIONS
========================================= */

.left-string .b1{
    left:5%;
    top:22px;

    transform:rotate(-12deg);
}


.left-string .b2{
    left:33%;
    top:15px;

    transform:rotate(-7deg);
}


.left-string .b3{
    left:61%;
    top:8px;

    transform:rotate(-3deg);
}


.left-string .b4{
    left:89%;
    top:2px;

    transform:rotate(2deg);
}


/* =========================================
   RIGHT BULB POSITIONS
   SAME AS LEFT - MIRRORED
========================================= */

.right-string .b1{
    right:5%;
    top:22px;

    transform:rotate(12deg);
}


.right-string .b2{
    right:33%;
    top:15px;

    transform:rotate(7deg);
}


.right-string .b3{
    right:61%;
    top:8px;

    transform:rotate(3deg);
}


.right-string .b4{
    right:89%;
    top:2px;

    transform:rotate(-2deg);
}


/* =========================================
   SMALL DECORATIVE DOTS
========================================= */

.dot{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff7e3;
}


/* LEFT DOTS */

.left-string .dot1{
    left:19%;
    top:19px;
}


.left-string .dot2{
    left:47%;
    top:12px;
}


.left-string .dot3{
    left:75%;
    top:5px;
}


/* RIGHT DOTS */

.right-string .dot1{
    right:19%;
    top:19px;
}


.right-string .dot2{
    right:47%;
    top:12px;
}


.right-string .dot3{
    right:75%;
    top:5px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .banner{
        height:155px;
    }


    /* TITLE */

    .rakhi-title{
        left:4%;

        font-size:
            clamp(18px,5.8vw,27px);

        -webkit-text-stroke:
            1.5px #ffffff;
    }


    /* IMAGE */

    .image-player{
        right:3px;

        width:39%;
        height:68%;
    }


    /* THREAD */

    .string{
        width:22%;
        height:48px;
    }


    .wire{
        top:-34px;

        height:56px;
    }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media(max-width:390px){

    .banner{
        height:145px;
    }


    .rakhi-title{
        left:3%;

        font-size:
            clamp(17px,5.5vw,23px);
    }


    .image-player{
        right:2px;

        width:40%;
        height:65%;
    }


    .string{
        width:23%;
    }

}

</style>
</head>


<body>


<div class="banner">


    <!-- =================================
         LEFT FESTIVAL LIGHTS
    ================================== -->

    <div class="string left-string">

        <div class="wire"></div>


        <div class="bulb b1">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b2">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b3">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b4">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>

    </div>



    <!-- =================================
         RIGHT FESTIVAL LIGHTS
    ================================== -->

    <div class="string right-string">

        <div class="wire"></div>


        <div class="bulb b1">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b2">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b3">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <div class="bulb b4">
            <span class="cord"></span>
            <span class="socket"></span>
            <span class="glass"></span>
        </div>


        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>

    </div>



    <!-- =================================
         TITLE
    ================================== -->

    <div class="rakhi-title">
        Celebrate Rakhi
    </div>



    <!-- =================================
         IMAGE PLAYER

         NO FADE
         NO SLIDE
         NO ZOOM

         1 → 2 → 3 → REPEAT
    ================================== -->

    <div class="image-player">

        <img
            src="1.png"
            class="image1"
            alt=""
        >

        <img
            src="2.png"
            class="image2"
            alt=""
        >

        <img
            src="3.png"
            class="image3"
            alt=""
        >

    </div>


</div>


</body>
</html>
